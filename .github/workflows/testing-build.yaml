name: Testing build

on:
  push:
    branches: [testing]
  workflow_dispatch:

concurrency:
  group: testing-build
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/RattoLauncher.App/RattoLauncher.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:Version=0.1.${{ github.run_number }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: RattoLauncher-win-x64-${{ github.run_number }}
          path: publish/
          retention-days: 14